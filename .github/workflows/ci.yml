name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, uat]
  pull_request:
    branches: [main, develop, uat]

env:
  COMPOSER_NO_INTERACTION: 1

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: ochumelye_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, gd, exif
          tools: composer:v2
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: Copy .env.ci as .env
        run: cp .env.ci .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Run Laravel Pint (Lint) - check mode
        run: vendor/bin/pint --test --config=vendor/laravel/pint/pint.json

      - name: Run PHPStan (Static Analysis)
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon --no-progress --error-format=github

      - name: Run PHPUnit Tests with Coverage
        run: vendor/bin/phpunit --coverage-clover=coverage-report/clover.xml --coverage-text=php://stdout --log-junit=coverage-report/junit.xml

      - name: Check coverage >= 50%
        run: |
          php -r "
            \$xml = simplexml_load_file('coverage-report/clover.xml');
            \$metrics = \$xml->project->metrics;
            \$statements = (int)\$metrics['statements'];
            \$covered = (int)\$metrics['coveredstatements'];
            \$percent = \$statements > 0 ? round(\$covered / \$statements * 100, 2) : 0;
            echo \"Coverage: \$percent%\n\";
            if (\$percent < 50) { echo \"##[error]Coverage \$percent% is below 50% threshold\n\"; exit(1); }
          "

  deploy-simulation:
    name: Deploy Simulation
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'uat' && 'uat' || 'development' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment and .env file
        id: env-vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            TARGET_ENV="production"
            ENV_FILE=".env.prod"
          elif [ "${{ github.ref_name }}" = "uat" ]; then
            TARGET_ENV="uat"
            ENV_FILE=".env.uat"
          else
            TARGET_ENV="development"
            ENV_FILE=".env.dev"
          fi
          echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT
          echo "env_file=$ENV_FILE" >> $GITHUB_OUTPUT

      - name: Simulate deployment
        run: |
          cp "${{ steps.env-vars.outputs.env_file }}" .env
          echo "============================================"
          echo "  Deploying to ${{ steps.env-vars.outputs.target_env }}"
          echo "  Using ${{ steps.env-vars.outputs.env_file }}"
          echo "============================================"
          echo "Environment file content:"
          cat .env

  notify:
    name: Notify Maintainers
    needs: [quality, deploy-simulation]
    if: always() && needs.quality.result != 'skipped'
    runs-on: ubuntu-latest

    steps:
      - name: Determine workflow conclusion
        id: conclusion
        run: |
          if [ "${{ needs.quality.result }}" = "success" ] && [ "${{ needs.deploy-simulation.result }}" = "success" ]; then
            echo "status=✅ Success" >> $GITHUB_OUTPUT
            echo "color=success" >> $GITHUB_OUTPUT
          elif [ "${{ needs.quality.result }}" = "failure" ] || [ "${{ needs.deploy-simulation.result }}" = "failure" ]; then
            echo "status=❌ Failed" >> $GITHUB_OUTPUT
            echo "color=failure" >> $GITHUB_OUTPUT
          else
            echo "status=⚠️ Partial" >> $GITHUB_OUTPUT
            echo "color=warning" >> $GITHUB_OUTPUT
          fi

      - name: Send notification
        run: |
          echo "Pipeline Status: ${{ steps.conclusion.outputs.status }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
